<!doctype html>
<html lang="en" data-theme="app-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NeuroGuesser · reveal dev</title>
<meta name="theme-color" content="#1c222b">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="../css/reveal.css">
<link rel="stylesheet" href="../css/viewer.css">
<link rel="stylesheet" href="../css/day-progress.css">
<link rel="stylesheet" href="../css/progress-bars.css">
<script type="importmap">{"imports":{
  "preact":"../vendor/preact/preact.module.js",
  "preact/hooks":"../vendor/preact/hooks.module.js",
  "htm":"../vendor/htm/htm.module.js",
  "three":"../vendor/three/three.module.min.js",
  "three/addons/":"../vendor/three/addons/"}}</script>
<style>
  /* dev page layout only: controls beside a 375 × 780 phone frame */
  body { background: var(--surface-sunken); }
  .dev { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; justify-content: center; padding: 24px 16px 48px; }
  .dev-controls { width: 360px; max-width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .dev-controls .card { gap: 10px; }
  .dev-phone { position: relative; flex: none; width: 375px; height: 780px; margin: 0; border: 1px solid var(--hairline); }
  .dev-phone .app-root { height: 100%; max-width: none; border: 0; }
  .dev-status { font: 400 10px/1.4 var(--font-mono); color: var(--ink-muted); overflow-wrap: anywhere; }
  @media (max-width: 420px) { .dev { padding: 0 0 48px; } .dev-controls { padding: 16px; } .dev-phone { width: 100%; border: 0; } }
  /* ?frame=full (screenshots): no controls, the app frame fills the window as in index.html */
  .dev.is-full { display: block; padding: 0; }
  .dev.is-full .dev-controls { display: none; }
  .dev.is-full .dev-phone { width: 100vw; height: 100vh; height: 100dvh; border: 0; }
  .dev.is-full .dev-phone .app-root { max-width: var(--column-max); margin: 0 auto; }
  /* frame=full from 1024 px: css/desktop.css (loaded by reveal.js in this frame only) lays out the whole window */
  @media (min-width: 1024px) { .dev.is-full .dev-phone .app-root { max-width: none; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="fx-layer" aria-hidden="true"></div>
<script type="module" src="reveal.js"></script>
</body>
</html>
